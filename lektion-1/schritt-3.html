<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lektion 1 · Schritt 3: Das Leben</title>
</head>
<body>
<style>
  :root {
    --hintergrund: #01050b;
    --text: #e8edf5;
    --akzent: #6ea8ff;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    color: var(--text);
    font-family: "Bricolage Grotesque", sans-serif;
    /* Lichtkegel, der der Maus folgt */
    background:
      radial-gradient(500px circle at var(--x, 50%) var(--y, 30%),
        color-mix(in srgb, var(--akzent) 22%, transparent), transparent 70%),
      var(--hintergrund);
  }
  header { max-width: 640px; padding: 32px; }
  .label { font-family: monospace; font-size: 12px; letter-spacing: .1em; opacity: .6; }
  h1 { font-size: 56px; line-height: 1; letter-spacing: -0.03em; margin: 16px 0; }
  em { color: var(--akzent); font-weight: 300; transition: color .6s; }
  p { opacity: .7; font-size: 18px; }
  a {
    display: inline-block; margin-top: 16px; padding: 14px 22px; border-radius: 12px;
    background: var(--text); color: var(--hintergrund); text-decoration: none;
    font-family: sans-serif; transition: transform .4s, background .4s;
  }
  a:hover { background: var(--akzent); transform: translateY(-3px); }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@300;600&display=swap">

<header>
  <span class="label">03 / Systeme</span>
  <h1>Wir bauen Euch ein <em>zweites Gehirn</em>.</h1>
  <p>KI-Studio für den deutschen Mittelstand.</p>
  <a href="#">Projekt anfragen</a>
</header>

<script>
  const wurzel = document.documentElement;

  // 1. Maus bewegt sich: Position in CSS-Variablen schreiben
  window.addEventListener('pointermove', (ereignis) => {
    wurzel.style.setProperty('--x', ereignis.clientX + 'px');
    wurzel.style.setProperty('--y', ereignis.clientY + 'px');
  });

  // 2. Klick: nächste Akzentfarbe nehmen
  const farben = ['#6ea8ff', '#ff6a35', '#7cf5c4', '#c79bff'];
  let nummer = 0;
  window.addEventListener('click', () => {
    nummer = (nummer + 1) % farben.length;
    wurzel.style.setProperty('--akzent', farben[nummer]);
  });
</script>
</body>
</html>
