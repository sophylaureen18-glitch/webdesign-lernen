<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Webdesign lernen</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@300;600&display=swap">
  <style>
    :root { --hintergrund: #01050b; --text: #e8edf5; --akzent: #6ea8ff; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--hintergrund);
      color: var(--text);
      font-family: "Bricolage Grotesque", sans-serif;
    }
    main { max-width: 720px; margin: 0 auto; padding: 80px 24px; }
    .label { font-family: monospace; font-size: 12px; letter-spacing: .1em; opacity: .6; }
    h1 { font-size: 56px; line-height: 1; letter-spacing: -0.03em; margin: 16px 0 40px; }
    em { color: var(--akzent); font-weight: 300; }
    a {
      display: block;
      padding: 20px 0;
      border-top: 1px solid rgba(232, 237, 245, .15);
      color: var(--text);
      text-decoration: none;
      font-size: 22px;
      transition: padding-left .4s, color .4s;
    }
    a:hover { padding-left: 12px; color: var(--akzent); }
    a span { font-family: monospace; font-size: 13px; opacity: .5; margin-right: 16px; }
  </style>
</head>
<body>
  <main>
    <span class="label">Mein Lernweg</span>
    <h1>Webdesign <em>lernen</em>.</h1>

    <a href="lektion-1/schritt-1.html"><span>1.1</span>Das Gerüst: HTML</a>
    <a href="lektion-1/schritt-2.html"><span>1.2</span>Das Aussehen: CSS</a>
    <a href="lektion-1/schritt-3.html"><span>1.3</span>Das Leben: JavaScript</a>
  </main>
</body>
</html>
